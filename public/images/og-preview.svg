<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <rect width="1200" height="630" fill="#070709"/>
  <defs>
    <radialGradient id="ogGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#24242A" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#070709" stop-opacity="1"/>
    </radialGradient>
    <filter id="ogShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="20" stdDeviation="30" flood-color="#000000" flood-opacity="0.9"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#ogGlow)"/>

  <!-- Minimalist framing -->
  <line x1="80" y1="80" x2="160" y2="80" stroke="#383842" stroke-width="2"/>
  <line x1="80" y1="80" x2="80" y2="160" stroke="#383842" stroke-width="2"/>
  <line x1="1120" y1="80" x2="1040" y2="80" stroke="#383842" stroke-width="2"/>
  <line x1="1120" y1="80" x2="1120" y2="160" stroke="#383842" stroke-width="2"/>
  <line x1="80" y1="550" x2="160" y2="550" stroke="#383842" stroke-width="2"/>
  <line x1="80" y1="550" x2="80" y2="470" stroke="#383842" stroke-width="2"/>
  <line x1="1120" y1="550" x2="1040" y2="550" stroke="#383842" stroke-width="2"/>
  <line x1="1120" y1="550" x2="1120" y2="470" stroke="#383842" stroke-width="2"/>

  <!-- Brand Typography -->
  <text x="600" y="270" font-family="'Syncopate', sans-serif" font-size="64" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="14">DE TO’ SHOP</text>
  <line x1="450" y1="310" x2="750" y2="310" stroke="#C5A880" stroke-width="2"/>
  <text x="600" y="360" font-family="'Space Grotesk', sans-serif" font-size="22" font-weight="400" fill="#A1A1AA" text-anchor="middle" letter-spacing="6">CATÁLOGO OFICIAL · LUXURY STREETWEAR</text>
  <text x="600" y="410" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="300" fill="#71717A" text-anchor="middle" letter-spacing="4">TU ESTILO. TU ESENCIA.</text>

  <!-- Tag badge -->
  <rect x="500" y="470" width="200" height="40" rx="6" fill="#141418" stroke="#383842" stroke-width="1.5"/>
  <text x="600" y="495" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="600" fill="#E4E4E7" text-anchor="middle" letter-spacing="3">COLECCIÓN DISPONIBLE</text>
</svg>
